<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculadora.css">
    <title>Calculadora</title>
</head>

<body>
    <h1 class="titlepage">Calculadora</h1>
    <h3 class="titlepage">Calculadora feita em JavaScript</h3>
    <hr>
    <div class="wrapper">
        <div class="form1">
            <form class="formulario" action="">
                <label for="num1">Número 1:</label>
                <input type="number" id="num1" placeholder="Digite o primeiro número">

                <label for="num2">Número 2:</label>
                <input type="number" id="num2" placeholder="Digite o segundo número">
            </form>
        </div>
        <div class="div_btn">
            <button class="btn" id="soma" onclick="calcular_numeros()">+</button>
            <button class="btn" id="sub" onclick="calcular_numeros()">-</button>
            <button class="btn" id="multi" onclick="calcular_numeros()">x</button>
            <button class="btn" id="div" onclick="calcular_numeros()">/</button>
        </div>
    </div>
    <script src="calculadora.js"></script>
</body>

</html>
