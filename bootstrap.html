<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="position: relative;">
    <div class="card shadow-lg w-100 mt-5" style="max-width: 480px;">
        <div class="card-body">
            <div class="text-center">
                <h1 class="card-title h3">Seja bem vindo!</h1>
                <p class="card-text text-muted">Faça seu login abaixo para acessar sua conta</p>
            </div>
            <div class="mt-4">
                <form action="">
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted">Endereço de Email</label>
                        <input type="email" class="form-control" id="email" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted">Senha</label>
                        <input type="password" class="form-control" id="password" placeholder="Senha" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg">Entrar</button>
                    </div>
                    <p class="text-center text-muted mt-4">Não tem uma conta?
                        <a href="#!" class="text-decoration-none">Cadastre-se</a>.
                    </p>
                </form>
            </div>
        </div>
    </div>
    




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
