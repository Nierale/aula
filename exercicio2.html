<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro formulário</title>
</head>

<body>
    <div>
        <h1 class="titlepage">Criando meu formulário</h1>
    </div>
    <hr>
    <div class="formulario">
        <h2>Formulário de cadastro</h2>
        <form class="form1" action="">
            <label for="">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <br>
            <label for="">Idade</label>
            <input type="number" id="idade" placeholder="Digite sua idade">
            <br>
            <button type="button" class="button_form" id="btn_enviar">Analisar</button>
        </form>
    </div>
    <div class="msg_text">
       <!-- <p id="resultado"></p> -->
       <label for="">Resultado da pesquisa:</label>
       <input id="resultado"></label>
    </div>
    <script src="form.js"></script>
</body>

</html>
